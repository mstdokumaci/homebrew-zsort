name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install formula from source
        run: |
          brew tap mstdokumaci/zsort "$PWD"
          brew install --formula --build-from-source mstdokumaci/zsort/zsort
          zsort --version
          brew test mstdokumaci/zsort/zsort
      - name: Audit formula
        run: brew audit --formula mstdokumaci/zsort/zsort
